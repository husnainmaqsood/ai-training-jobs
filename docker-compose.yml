# Local/production-like stack. For production use managed Postgres/Redis and real secrets.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aitrainjobs
      POSTGRES_USER: aitrainjobs
      POSTGRES_PASSWORD: aitrainjobs-dev-only
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aitrainjobs"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
  web: &app
    build: .
    command: web
    env_file: .env
    environment:
      DATABASE_URL: postgres://aitrainjobs:aitrainjobs-dev-only@db:5432/aitrainjobs
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "0"
      SECURE_SSL_REDIRECT: "0"
    ports: ["8000:8000"]
    volumes: [private_media:/data/private_media]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
  worker:
    <<: *app
    command: worker
    ports: []
  beat:
    <<: *app
    command: beat
    ports: []
volumes:
  pgdata:
  private_media:
