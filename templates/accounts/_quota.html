<div class="card card-body">
  <div class="flex items-center justify-between">
    <p class="stat-label">AI generations · {{ quota.plan.name }}</p>
    <a href="{% url 'billing:pricing' %}" class="text-xs font-semibold">{% if quota.plan.is_free %}Upgrade{% else %}Plans{% endif %}</a>
  </div>
  <p class="stat-value">{{ quota.remaining }} <span class="text-base font-medium text-ink-500">of {{ quota.limit }} left</span></p>
  <div class="mt-3 h-2 overflow-hidden rounded-full bg-ink-100" role="progressbar" aria-valuemin="0" aria-valuemax="{{ quota.limit }}" aria-valuenow="{{ quota.used }}" aria-label="Generations used">
    <div class="h-full rounded-full bg-brand-600" style="width: {% widthratio quota.used quota.limit 100 %}%"></div>
  </div>
  <p class="mt-2 text-xs text-ink-500">Resets {{ quota.period.end|date:"d M Y" }}. Failed generations are refunded automatically.</p>
</div>
