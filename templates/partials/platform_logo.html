{% load ui %}{# Platform logo, or coloured initials when none is set. Params: p (Platform), size (extra classes, optional). #}{% if p.logo_version %}<span class="avatar {{ size }} overflow-hidden bg-white p-1 ring-1 ring-inset ring-ink-950/[.07]" aria-hidden="true"><img src="{{ p.logo_url }}" alt="" width="64" height="64" loading="lazy" decoding="async" class="h-full w-full rounded-[inherit] object-contain"></span>{% else %}<span class="avatar {{ size }} {{ p.name|avatar_class }}" aria-hidden="true">{{ p.name|initials }}</span>{% endif %}
