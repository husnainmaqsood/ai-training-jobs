{% if messages %}
<div class="pointer-events-none fixed inset-x-4 bottom-4 z-50 flex flex-col items-end gap-2 sm:inset-x-auto sm:right-6 sm:bottom-6" role="status" aria-live="polite">
  {% for message in messages %}
  <div data-message data-autodismiss class="toast {% if message.tags == 'error' %}border-red-200{% elif message.tags == 'warning' %}border-amber-200{% elif message.tags == 'success' %}border-emerald-200{% else %}border-ink-950/[.07]{% endif %}">
    <span class="mt-1.5 h-2 w-2 shrink-0 rounded-full {% if message.tags == 'error' %}bg-red-500{% elif message.tags == 'warning' %}bg-amber-500{% elif message.tags == 'success' %}bg-emerald-500{% else %}bg-brand-500{% endif %}" aria-hidden="true"></span>
    <span class="flex-1 text-ink-800">{{ message }}</span>
    <button type="button" data-dismiss class="-mr-1 shrink-0 rounded-full p-1 text-ink-400 transition-colors hover:bg-ink-100 hover:text-ink-900" aria-label="Dismiss"><svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M6.28 5.22a.75.75 0 0 0-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 1 0 1.06 1.06L10 11.06l3.72 3.72a.75.75 0 1 0 1.06-1.06L11.06 10l3.72-3.72a.75.75 0 0 0-1.06-1.06L10 8.94 6.28 5.22Z"/></svg></button>
  </div>
  {% endfor %}
</div>
{% endif %}
