{% load ui %}
<div class="rounded-xl border border-line bg-white p-3 shadow-sm" id="app-{{ a.pk }}">
  <a href="{% url 'tracker:detail' a.pk %}" class="block font-medium text-ink-900 no-underline hover:text-brand-700">{{ a.title }}</a>
  <p class="text-xs text-ink-500">{{ a.company }}{% if a.applied_at %} · applied {{ a.applied_at|date:"d M" }}{% endif %}</p>
  {% if a.next_step_at %}<p class="mt-1 text-xs text-amber-700">Next: {{ a.next_step_at|date:"d M" }}</p>{% endif %}
  <form method="post" action="{% url 'tracker:status' a.pk %}" class="mt-2" hx-post="{% url 'tracker:status' a.pk %}" hx-target="#app-{{ a.pk }}" hx-swap="outerHTML">{% csrf_token %}
    <label class="sr-only" for="st-{{ a.pk }}">Status</label>
    <select id="st-{{ a.pk }}" name="status" class="select py-1 text-xs">
      {% for v, l in a.Status.choices %}<option value="{{ v }}" {% if v == a.status %}selected{% endif %}>{{ l }}</option>{% endfor %}
    </select>
    <button class="btn-ghost btn-sm mt-1" type="submit">Update</button>
  </form>
</div>
